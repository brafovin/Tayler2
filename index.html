<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLUE LOCK 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Arial Black',Arial,sans-serif}
#c{display:block;width:100vw;height:100vh}

/* ── LOADING ── */
#loading{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999}
#loading .logo{font-size:88px;font-weight:900;color:#0af;text-shadow:0 0 60px #0af,0 0 120px #06f;letter-spacing:12px;animation:flicker 2s infinite}
#loading .sub{color:#fff;font-size:13px;letter-spacing:8px;opacity:.6;margin-top:6px}
@keyframes flicker{0%,100%{opacity:1}92%{opacity:.85}95%{opacity:.3}97%{opacity:.9}}
.lbar-wrap{width:420px;height:3px;background:#0a0f1a;border-radius:2px;margin-top:40px;overflow:hidden}
.lbar{height:100%;width:0%;background:linear-gradient(90deg,#06f,#0af,#fff);border-radius:2px;transition:width .25s;box-shadow:0 0 14px #0af}
.ltxt{color:#4af;font-size:11px;letter-spacing:3px;margin-top:14px}

/* ── CHARACTER SELECT ── */
#select{position:fixed;inset:0;background:radial-gradient(ellipse at 30% 60%,#001840 0%,#000510 70%);display:none;flex-direction:column;align-items:center;justify-content:flex-start;padding:30px 20px 20px;overflow-y:auto;z-index:99}
#select h1{font-size:64px;font-weight:900;color:#0af;text-shadow:0 0 50px #0af,0 0 100px #06f;letter-spacing:10px}
#select h2{color:#fff;font-size:13px;letter-spacing:6px;opacity:.55;margin-top:6px;margin-bottom:36px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;max-width:920px;width:100%;margin-bottom:28px}
.card{background:linear-gradient(145deg,rgba(0,20,60,.95),rgba(0,8,28,.95));border:1.5px solid rgba(0,170,255,.2);border-radius:14px;padding:18px 14px;cursor:pointer;transition:all .18s;text-align:center;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(0,170,255,.04),transparent);opacity:0;transition:.18s}
.card:hover,.card.sel{border-color:#0af;box-shadow:0 0 28px rgba(0,170,255,.45),inset 0 0 20px rgba(0,170,255,.06);transform:translateY(-4px)}
.card:hover::before,.card.sel::before{opacity:1}
.card .num{font-size:32px;font-weight:900;color:#0af;text-shadow:0 0 14px #0af;line-height:1}
.card .cn{color:#fff;font-size:12px;font-weight:700;margin-top:6px;line-height:1.3}
.card .cr{color:#4af;font-size:9px;letter-spacing:2px;margin-top:3px}
.card .cs{color:#f48;font-size:9px;margin-top:7px;font-style:italic;line-height:1.4}
.card .cstar{font-size:16px;margin-top:4px}
.sbtn{background:linear-gradient(135deg,#0044dd,#0099ff);border:none;border-radius:14px;padding:18px 72px;color:#fff;font-size:18px;font-weight:900;letter-spacing:5px;cursor:pointer;box-shadow:0 0 40px rgba(0,120,255,.6);transition:all .18s;margin-top:4px}
.sbtn:hover{box-shadow:0 0 60px rgba(0,180,255,.8);transform:scale(1.04)}
.stitle{color:#0af;font-size:10px;letter-spacing:5px;margin-bottom:14px;opacity:.7}

/* ── HUD ── */
#hud{position:fixed;inset:0;pointer-events:none;z-index:20;display:none}
#score-panel{position:absolute;top:18px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,rgba(0,6,24,.97),rgba(0,20,60,.97));border:1.5px solid #0af;border-radius:14px;padding:12px 44px 10px;text-align:center;box-shadow:0 0 40px rgba(0,170,255,.3),inset 0 0 30px rgba(0,170,255,.05)}
#score-panel .teams{display:flex;align-items:center;gap:18px}
.tnm{color:#0af;font-size:12px;font-weight:900;letter-spacing:3px;text-shadow:0 0 12px #0af;min-width:90px}
.tnm.right{text-align:right}
#score-val{color:#fff;font-size:40px;font-weight:900;text-shadow:0 0 24px #0af;letter-spacing:4px}
#timer{color:#7be;font-size:11px;letter-spacing:4px;margin-top:3px;text-align:center}

#pinfo{position:absolute;bottom:90px;left:18px;background:linear-gradient(135deg,rgba(0,6,24,.97),rgba(0,20,60,.92));border:1.5px solid rgba(0,170,255,.5);border-radius:12px;padding:14px 20px;min-width:220px;box-shadow:0 0 24px rgba(0,170,255,.2)}
.pn{color:#fff;font-size:17px;font-weight:900;text-shadow:0 0 10px #0af}
.pp{color:#0af;font-size:10px;letter-spacing:2px;margin-top:2px}
.gauge-label{color:#5af;font-size:9px;letter-spacing:3px;margin-top:10px;display:flex;justify-content:space-between}
.gauge-wrap{background:rgba(0,0,0,.6);border:1px solid rgba(0,170,255,.25);border-radius:5px;height:10px;margin-top:4px;overflow:hidden}
.gauge-fill{height:100%;border-radius:5px;transition:width .25s;background:linear-gradient(90deg,#06f,#0af,#fff);box-shadow:0 0 8px #0af}

#ctrl-bar{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:10px}
.cbtn{background:rgba(0,8,30,.88);border:1px solid rgba(0,170,255,.3);border-radius:8px;padding:7px 14px;color:#7be;font-size:10px;letter-spacing:1px;white-space:nowrap}
.cbtn b{color:#fff}

#goal-notif{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;opacity:0;transition:opacity .4s;pointer-events:none}
#goal-notif .gt{font-size:96px;font-weight:900;color:#fff;letter-spacing:14px;text-shadow:0 0 60px #0af,0 0 120px #06f;animation:gp .28s ease-in-out infinite alternate}
#goal-notif .gs{font-size:20px;color:#0af;text-shadow:0 0 18px #0af;letter-spacing:4px;margin-top:4px}
@keyframes gp{from{transform:scale(1)}to{transform:scale(1.1)}}

#shot-notif{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
#shot-notif .sn{font-size:48px;font-weight:900;letter-spacing:5px;opacity:0;transition:opacity .15s;text-stroke:2px rgba(0,0,0,.5)}
#shot-notif .sp{color:#fff;font-size:13px;letter-spacing:6px;opacity:0;margin-top:4px;transition:opacity .15s}

#minimap{position:absolute;bottom:18px;right:18px;width:170px;height:108px;background:rgba(0,10,28,.88);border:1.5px solid rgba(0,170,255,.3);border-radius:10px;overflow:hidden;box-shadow:0 0 16px rgba(0,170,255,.15)}
#mm{width:100%;height:100%}

#bllogo{position:absolute;top:18px;left:18px;color:#0af;font-size:10px;font-weight:900;letter-spacing:5px;text-shadow:0 0 14px #0af;opacity:.65}

/* ── CINEMATIC BAR ── */
#cin-top,#cin-bot{position:fixed;left:0;right:0;height:0;background:#000;z-index:30;transition:height .3s}
#cin-top{top:0}
#cin-bot{bottom:0}
</style>
</head>

  {name:"HIORI YO",        num:16,role:"CM", special:"SPATIAL AWARENESS SHOT", pc:0x000d22,ac:0x3377ff,sc:0x88aaff,ec:0x000611},

];

// ═══════════════════════════════════════════════════
//  GLOBALS
// ═══════════════════════════════════════════════════
let scene,cam,ren,clock;
let players=[],ball,particles=[];
let keys={};
let ctrl=null;
let selIdx=0;
let sH=0,sA=0,gTime=0;
let gauge=0;
let sCooldown=0,pCooldown=0,spCooldown=0;
let goalCD=0;
let mmCtx;
let cinematic=false,cinTimer=0,cinTarget=null;
const FW=68,FL=105,GW=7.32,GH=2.44;

// ═══════════════════════════════════════════════════
//  LOADING
// ═══════════════════════════════════════════════════
function lp(p,t){document.getElementById('lb').style.width=p+'%';document.getElementById('lt').textContent=t}
const W=s=>new Promise(r=>setTimeout(r,s));

async function init(){
  lp(8,'LOADING THREE.JS...');await W(80);
  lp(22,'BUILDING 3D ENGINE...');
  initScene();
  lp(40,'CONSTRUCTING STADIUM...');await W(60);
  lp(58,'GENERATING FIELD...');await W(60);
  lp(72,'CREATING PLAYER MODELS...');await W(80);
  lp(88,'LOADING EFFECTS SYSTEM...');await W(80);
  mmCtx=document.getElementById('mm2').getContext('2d');
  lp(100,'KICK OFF READY!');await W(500);
  document.getElementById('loading').style.display='none';
  showSelect();
}

// ═══════════════════════════════════════════════════
//  SELECT SCREEN
// ═══════════════════════════════════════════════════
function showSelect(){
  const g=document.getElementById('grid');
  g.innerHTML='';
  BL.forEach((p,i)=>{
    const d=document.createElement('div');
    d.className='card'+(i===selIdx?' sel':'');
    d.innerHTML=`<div class="num">#${p.num}</div><div class="cn">${p.name}</div><div class="cr">${p.role}</div><div class="cstar">${p.stars}</div><div class="cs">${p.special}</div>`;
    d.onclick=()=>{document.querySelectorAll('.card').forEach(c=>c.classList.remove('sel'));d.classList.add('sel');selIdx=i};
    g.appendChild(d);
  });
  document.getElementById('select').style.display='flex';
}

function startGame(){
  document.getElementById('select').style.display='none';
  document.getElementById('hud').style.display='block';
  buildWorld();
  clock.start();
  loop();
}

// ═══════════════════════════════════════════════════
//  SCENE
// ═══════════════════════════════════════════════════
function initScene(){
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x000408);
  scene.fog=new THREE.FogExp2(0x000d20,0.014);

  cam=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,600);
  cam.position.set(0,20,32);cam.lookAt(0,0,0);

  const cv=document.getElementById('c');
  ren=new THREE.WebGLRenderer({canvas:cv,antialias:true,powerPreference:'high-performance'});
  ren.setSize(innerWidth,innerHeight);
  ren.setPixelRatio(Math.min(devicePixelRatio,2));
  ren.shadowMap.enabled=true;
  ren.shadowMap.type=THREE.PCFSoftShadowMap;
  ren.toneMapping=THREE.ACESFilmicToneMapping;
  ren.toneMappingExposure=1.05;

  clock=new THREE.Clock();

  // Ambient
  scene.add(new THREE.AmbientLight(0x0a1a33,1.2));

  // Main stadium light
  const dl=new THREE.DirectionalLight(0xffffff,1.4);
  dl.position.set(15,50,25);
  dl.castShadow=true;
  dl.shadow.mapSize.set(4096,4096);
  dl.shadow.camera.near=1;dl.shadow.camera.far=250;
  dl.shadow.camera.left=-90;dl.shadow.camera.right=90;
  dl.shadow.camera.top=90;dl.shadow.camera.bottom=-90;
  dl.shadow.bias=-0.001;
  scene.add(dl);

  // 4 flood lights
  [[-28,-50],[28,-50],[-28,50],[28,50]].forEach(([x,z])=>{
    const l=new THREE.SpotLight(0x7799ff,3,200,Math.PI/5,.4,1.2);
    l.position.set(x,52,z);l.target.position.set(0,0,0);
    l.castShadow=true;l.shadow.mapSize.set(512,512);
    scene.add(l);scene.add(l.target);
  });

  // Rim fill
  scene.add(Object.assign(new THREE.PointLight(0x334488,1.5,180),{position:new THREE.Vector3(0,30,0)}));

  window.addEventListener('resize',()=>{
    cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();
    ren.setSize(innerWidth,innerHeight);
  });
  window.addEventListener('keydown',e=>{
    keys[e.code]=true;
    if(e.code==='Tab'){e.preventDefault();if(ctrl)switchPlayer();}
  });
  window.addEventListener('keyup',e=>{keys[e.code]=false;});
}

// ═══════════════════════════════════════════════════
//  WORLD BUILD
// ═══════════════════════════════════════════════════
function buildWorld(){
  buildField();buildStadium();buildGoals();buildBall();buildPlayers();
  updateHUD();
}

// ── FIELD ──
function buildField(){
  // Base ground beyond pitch
  const gnd=new THREE.Mesh(new THREE.PlaneGeometry(500,500),new THREE.MeshLambertMaterial({color:0x060e06}));
  gnd.rotation.x=-Math.PI/2;gnd.receiveShadow=true;scene.add(gnd);

  // Grass checkerboard stripes
  const cols=[0x0c3d0c,0x0a3309];
  for(let i=0;i<14;i++){
    const m=new THREE.Mesh(
      new THREE.PlaneGeometry(FW,FL/14),
      new THREE.MeshLambertMaterial({color:cols[i%2]})
    );
    m.rotation.x=-Math.PI/2;
    m.position.set(0,.005,-FL/2+FL/28+i*FL/14);
    m.receiveShadow=true;
    scene.add(m);
  }

  // Lines
  const lm=new THREE.MeshBasicMaterial({color:0xffffff,opacity:.92,transparent:true});
  const hw=FW/2,hl=FL/2;
  function ln(x1,z1,x2,z2,w=.13){
    const dx=x2-x1,dz=z2-z1,len=Math.hypot(dx,dz);
    const m=new THREE.Mesh(new THREE.PlaneGeometry(w,len),lm);
    m.rotation.x=-Math.PI/2;m.rotation.z=-Math.atan2(dx,dz);
    m.position.set((x1+x2)/2,.015,(z1+z2)/2);scene.add(m);
  }
  ln(-hw,-hl,hw,-hl);ln(-hw,hl,hw,hl);
  ln(-hw,-hl,-hw,hl);ln(hw,-hl,hw,hl);
  ln(-hw,0,hw,0);
  // Center circle
  scene.add(Object.assign(new THREE.Mesh(new THREE.RingGeometry(9.15,9.28,64),lm),{rotation:new THREE.Euler(-Math.PI/2,0,0),position:new THREE.Vector3(0,.015,0)}));
  scene.add(Object.assign(new THREE.Mesh(new THREE.CircleGeometry(.3,16),lm),{rotation:new THREE.Euler(-Math.PI/2,0,0),position:new THREE.Vector3(0,.015,0)}));
  // Penalty areas
  [-1,1].forEach(s=>{
    const pz=s*hl,sg=-s;
    ln(-20.15,pz,20.15,pz);
    ln(-20.15,pz,-20.15,pz+sg*16.5);ln(20.15,pz,20.15,pz+sg*16.5);
    ln(-20.15,pz+sg*16.5,20.15,pz+sg*16.5);
    ln(-9.16,pz,9.16,pz);
    ln(-9.16,pz,-9.16,pz+sg*5.5);ln(9.16,pz,9.16,pz+sg*5.5);
    ln(-9.16,pz+sg*5.5,9.16,pz+sg*5.5);
    const ps=new THREE.Mesh(new THREE.CircleGeometry(.28,14),lm);
    ps.rotation.x=-Math.PI/2;ps.position.set(0,.015,pz+sg*11);scene.add(ps);
    const arc=new THREE.Mesh(new THREE.RingGeometry(9.15,9.28,64,1,0,Math.PI),lm);
    arc.rotation.x=-Math.PI/2;arc.rotation.z=s>0?0:Math.PI;arc.position.set(0,.015,pz+sg*11);scene.add(arc);
    // Corner arcs
    [-hw,hw].forEach(cx=>{
      const ca=new THREE.Mesh(new THREE.RingGeometry(.95,1.08,32,1,0,Math.PI/2),lm);
      ca.rotation.x=-Math.PI/2;
      const baseAng=cx<0?(s<0?0:Math.PI/2*3):(s<0?Math.PI/2:Math.PI);
      ca.rotation.z=baseAng;
      ca.position.set(cx,.015,pz);scene.add(ca);
    });
  });
}

// ── STADIUM ──
function buildStadium(){
  // Stands
  const sm=new THREE.MeshLambertMaterial({color:0x0a1a2a});
  const standDef=[
    {w:FW+24,h:18,d:6,x:0,z:-(FL/2+18),ry:0},
    {w:FW+24,h:18,d:6,x:0,z:FL/2+18,ry:Math.PI},
    {w:6,h:14,d:FL+24,x:-(FW/2+18),z:0,ry:0},
    {w:6,h:14,d:FL+24,x:FW/2+18,z:0,ry:0},

function spawnParticles(pos,color,cnt,spread,spd,size,life,gravity=4){
  const geo=new THREE.BufferGeometry();
  const pa=new Float32Array(cnt*3);
  const va=[];
  for(let i=0;i<cnt;i++){
    pa[i*3]=pos.x;pa[i*3+1]=pos.y+.4;pa[i*3+2]=pos.z;
    const θ=Math.random()*Math.PI*2,φ=Math.random()*Math.PI;
    va.push(new THREE.Vector3(
      Math.sin(φ)*Math.cos(θ)*spread*(Math.random()+.3),
      Math.abs(Math.cos(φ))*spd+.3,
      Math.sin(φ)*Math.sin(θ)*spread*(Math.random()+.3)
    ));
  }
  geo.setAttribute('position',new THREE.BufferAttribute(pa,3));
  const mat=new THREE.PointsMaterial({color,size,sizeAttenuation:true,transparent:true,opacity:1,depthWrite:false});
  const pts=new THREE.Points(geo,mat);
  scene.add(pts);
  particles.push({pts,geo,va,life,maxLife:life,cnt,grav:gravity});
}

  for(let r=0;r<4;r++){
    setTimeout(()=>{
      const rg=new THREE.RingGeometry(.6,.85,48);

      const ring=new THREE.Mesh(rg,rm);

    },r*90);

function tickParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.life-=dt;
    if(p.life<=0){scene.remove(p.pts);p.pts.geometry.dispose();p.pts.material.dispose();particles.splice(i,1);continue;}
    const pa=p.geo.attributes.position.array;
    for(let j=0;j<p.cnt;j++){
      pa[j*3]+=p.va[j].x*dt;
      pa[j*3+1]+=p.va[j].y*dt;
      pa[j*3+2]+=p.va[j].z*dt;
      p.va[j].y-=p.grav*dt;
    }
    p.geo.attributes.position.needsUpdate=true;
    p.pts.material.opacity=(p.life/p.maxLife)*(.9+Math.sin(p.life*8)*.1);
  }
}

//  ANIMATION
// ═══════════════════════════════════════════════════
function animatePlayer(p,dt,isMoving,speed){
  const spd=isMoving?speed:0;
  p.at+=dt*(spd*1.8+1.5);
  const t=p.at;
  const walk=Math.min(spd/8,1);
  const amp=walk*.38;

  if(p.mesh.userData.legs){
    p.mesh.userData.legs.forEach((leg,li)=>{
      const ph=leg.phase;
      const swing=Math.sin(t+ph)*amp;
      leg.hip.rotation.x=swing;
      leg.knee.rotation.x=Math.max(0,-swing)*1.2;
    });
  }
  if(p.mesh.userData.arms){
    p.mesh.userData.arms.forEach((arm,ai)=>{
      const opp=ai===0?1:-1;
      arm.shoulder.rotation.x=Math.sin(t+opp*Math.PI)*amp*.7;
    });
  }

  // Aura pulse
  const aura=p.mesh.userData.aura;
  if(aura){
    const targetOpacity=p.controlled?(.15+walk*.45):0;
    aura.material.opacity+=(targetOpacity-aura.material.opacity)*dt*5;
    const ps=1+Math.sin(t*3)*.08;
    aura.scale.set(ps,ps,ps);
  }
}

function switchPlayer(){
  const team=players.filter(p=>p.team===0&&p.data.role!=='GK');
  const idx=team.indexOf(ctrl);
  if(ctrl)ctrl.controlled=false;
  ctrl=team[(idx+1)%team.length];
  ctrl.controlled=true;
  updateHUD();
  spawnParticles(ctrl.pos.clone(),ctrl.data.ac,20,1.5,2,.1,.4);
}

function handleInput(dt){
  if(!ctrl)return;
  const sprint=keys['ShiftLeft']||keys['ShiftRight'];
  const baseSpd=sprint?13.5:7.5;
  const dir=new THREE.Vector3();
  if(keys['KeyW']||keys['ArrowUp'])dir.z-=1;
  if(keys['KeyS']||keys['ArrowDown'])dir.z+=1;
  if(keys['KeyA']||keys['ArrowLeft'])dir.x-=1;
  if(keys['KeyD']||keys['ArrowRight'])dir.x+=1;

  const isMoving=dir.length()>.01;
  if(isMoving){
    dir.normalize();
    ctrl.pos.addScaledVector(dir,baseSpd*dt);
    ctrl.mesh.rotation.y=Math.atan2(dir.x,dir.z);
    if(sprint){gauge=Math.min(100,gauge+dt*12);}
    else{gauge=Math.min(100,gauge+dt*5);}
  }
  ctrl.pos.x=Math.max(-FW/2,Math.min(FW/2,ctrl.pos.x));
  ctrl.pos.z=Math.max(-FL/2,Math.min(FL/2,ctrl.pos.z));
  ctrl.mesh.position.set(ctrl.pos.x,0,ctrl.pos.z);
  animatePlayer(ctrl,dt,isMoving,baseSpd);

  // Pickup
  if(ctrl.pos.distanceTo(ball.position)<1.3&&!ball.userData.owned){
    ball.userData.owned=true;ball.userData.owner=ctrl;ctrl.hasBall=true;
  }

  sCooldown-=dt;pCooldown-=dt;spCooldown-=dt;

  if(keys['Space']&&sCooldown<=0&&ctrl.hasBall){shoot(ctrl,false);sCooldown=.7;}
  if(keys['KeyQ']&&spCooldown<=0&&ctrl.hasBall&&gauge>=55){
    shoot(ctrl,true);spCooldown=3.5;gauge=0;showSpecialShot(ctrl.data);
  }
  if(keys['KeyE']&&pCooldown<=0&&ctrl.hasBall){pass(ctrl);pCooldown=.5;}
}

function shoot(player,special){
  const goalZ=player.team===0?-FL/2:FL/2;
  const dx=(Math.random()-.5)*.18;
  const dz=goalZ<0?-1:1;
  const dir=new THREE.Vector3(dx,0,dz).normalize();
  const pow=special?30:20+Math.random()*5;
  ball.userData.owned=false;ball.userData.owner=null;player.hasBall=false;
  ball.userData.vx=dir.x*pow;
  ball.userData.vy=special?9:4.5+Math.random()*3.5;
  ball.userData.vz=dir.z*pow;
  if(special){
    spawnSpecialFX(ball.position.clone(),player.data);
    setBallGlow(player.data.sc,2.2);
    startCinematic(2.2);
  }else{
    spawnParticles(ball.position.clone(),player.data.ac,25,1.2,2.5,.1,.5);
  }
}

function pass(player){
  const mates=players.filter(p=>p.team===player.team&&p!==player);
  if(!mates.length)return;
  let best=null,bs=-Infinity;
  mates.forEach(t=>{
    const adv=player.team===0?-t.pos.z:t.pos.z;
    const d=player.pos.distanceTo(t.pos);
    if(d>1&&d<35&&adv-d*.1>bs){bs=adv-d*.1;best=t;}
  });
  if(!best)best=mates[Math.floor(Math.random()*mates.length)];
  const dir=best.pos.clone().sub(player.pos).normalize();
  ball.userData.owned=false;ball.userData.owner=null;player.hasBall=false;
  ball.userData.vx=dir.x*17;ball.userData.vy=2;ball.userData.vz=dir.z*17;
  spawnParticles(ball.position.clone(),0x0099ff,15,.6,1.8,.08,.4);
}

// ═══════════════════════════════════════════════════
//  BALL PHYSICS
// ═══════════════════════════════════════════════════
let ballGlowTimer=0,ballGlowColor=0xffffff;
function setBallGlow(c,d){ballGlowTimer=d;ballGlowColor=c;ball.material.emissive.setHex(c);ball.material.emissiveIntensity=2;}

function tickBall(dt){
  const b=ball.userData;
  if(b.owned&&b.owner){
    const off=new THREE.Vector3(0,0,b.owner.team===0?-.55:.55);
    off.applyEuler(b.owner.mesh.rotation);
    ball.position.set(b.owner.pos.x+off.x,.23,b.owner.pos.z+off.z);
    // Ball shadow
    if(ball.userData.shadow)ball.userData.shadow.position.set(ball.position.x,.01,ball.position.z);
    return;
  }

  b.vy-=13*dt;
  ball.position.x+=b.vx*dt;
  ball.position.y+=b.vy*dt;
  ball.position.z+=b.vz*dt;

  if(ball.position.y<=.23){
    ball.position.y=.23;b.vy=Math.abs(b.vy)*.44;
    b.vx*=.83;b.vz*=.83;
    if(Math.abs(b.vy)<.4)b.vy=0;
  }

  ball.rotation.z+=b.vx*dt*2.4;
  ball.rotation.x-=b.vz*dt*2.4;

  const speed=Math.hypot(b.vx,b.vz);
  if(speed>3.5) spawnTrail(ball.position,ballGlowTimer>0?ballGlowColor:0xffffff);

  if(ballGlowTimer>0){
    ballGlowTimer-=dt;
    ball.material.emissiveIntensity=Math.max(0,ballGlowTimer/2.2*2);
    ball.userData.glow.intensity=Math.max(0,ballGlowTimer/2.2*3);
    ball.userData.glow.color.setHex(ballGlowColor);
    if(ballGlowTimer<=0){ball.material.emissive.setHex(0x001122);ball.material.emissiveIntensity=.08;ball.userData.glow.intensity=0;}
  }else{ball.userData.glow.intensity=0;}

  // Wall
  if(ball.position.x<-FW/2+.23){ball.position.x=-FW/2+.23;b.vx=Math.abs(b.vx)*.55;}
  if(ball.position.x>FW/2-.23){ball.position.x=FW/2-.23;b.vx=-Math.abs(b.vx)*.55;}
  if(ball.position.z<-FL/2-.5){ball.position.z=-FL/2;b.vz=Math.abs(b.vz)*.3;}
  if(ball.position.z>FL/2+.5){ball.position.z=FL/2;b.vz=-Math.abs(b.vz)*.3;}

  // Ball shadow
  if(ball.userData.shadow){
    ball.userData.shadow.position.set(ball.position.x,.01,ball.position.z);
    const ht=Math.max(0,1-(ball.position.y-.23)*.15);
    ball.userData.shadow.material.opacity=.4*ht;
    const sc=Math.max(.5,1-ball.position.y*.05);
    ball.userData.shadow.scale.set(sc,sc,sc);
  }

  checkGoal();
}

function checkGoal(){
  goalCD-=.016;if(goalCD>0)return;
  const z=ball.position.z,x=ball.position.x,y=ball.position.y;
  if(z<-FL/2-.3&&Math.abs(x)<GW/2&&y<GH+.5){
    sH++;document.getElementById('sh').textContent=sH;
    triggerGoal(ctrl?ctrl.data.name:'BLUE LOCK');resetField();goalCD=5;
  }else if(z>FL/2+.3&&Math.abs(x)<GW/2&&y<GH+.5){
    sA++;document.getElementById('sa').textContent=sA;
    triggerGoal('NEO EGOIST');resetField();goalCD=5;
  }
}

function triggerGoal(scorer){
  spawnGoalFX();
  document.getElementById('gscorer').textContent=scorer+' — TOOOR!';
  const n=document.getElementById('goal-notif');n.style.opacity='1';
  setTimeout(()=>n.style.opacity='0',3200);
}

function resetField(){
  ball.position.set(0,.23,0);
  ball.userData.vx=0;ball.userData.vy=0;ball.userData.vz=0;
  ball.userData.owned=false;ball.userData.owner=null;
  players.forEach(p=>{p.pos.copy(p.home);p.mesh.position.copy(p.home);p.hasBall=false;});
}

// ═══════════════════════════════════════════════════
//  AI
// ═══════════════════════════════════════════════════
function tickAI(dt){
  players.forEach(p=>{
    if(p===ctrl)return;
    const team=p.team,goalZ=team===0?-FL/2:FL/2;
    const db=p.pos.distanceTo(ball.position);
    let tx=p.home.x,tz=p.home.z;
    const myGoalZ=team===0?FL/2:-FL/2;

    if(!ball.userData.owned&&db<18){
      tx=ball.position.x;tz=ball.position.z;
    }else if(ball.userData.owner&&ball.userData.owner.team!==team){
      // Defend
      const angle=Math.random()*.4-.2;
      tx=ball.position.x+Math.sin(angle)*3;
      tz=ball.position.z+(team===0?3.5:-3.5);
      // GK stays near post
      if(p.data.role==='GK'){tx=Math.max(-3,Math.min(3,ball.position.x*.4));tz=myGoalZ*(1-.08);}
    }else if(ball.userData.owner&&ball.userData.owner.team===team){
      // Support run
      tx=p.home.x+(Math.random()-.5)*6;
      tz=p.home.z+(team===0?-4:4);
      if(p.data.role==='GK'){tx=p.home.x;tz=p.home.z;}
    }

    const dx=tx-p.pos.x,dz=tz-p.pos.z,dist=Math.hypot(dx,dz);
    if(dist>.6){
      const spd=p.data.role==='GK'?4.5:6.5;
      p.pos.x+=dx/dist*spd*dt;p.pos.z+=dz/dist*spd*dt;
      p.mesh.position.set(p.pos.x,0,p.pos.z);
      p.mesh.rotation.y=Math.atan2(dx,dz);
      animatePlayer(p,dt,true,6.5);
    }else{animatePlayer(p,dt,false,0);}

    // Ball pickup
    if(db<1.1&&!ball.userData.owned){
      ball.userData.owned=true;ball.userData.owner=p;p.hasBall=true;
    }

    // Decision
    if(p.hasBall){
      const dgoal=Math.abs(p.pos.z-goalZ);
      if(dgoal<22&&Math.random()<.01){
        const sp=Math.random()<.18;
        if(sp)showSpecialShot(p.data);
        const dir=new THREE.Vector3((Math.random()-.5)*.22,0,goalZ<0?-1:1).normalize();
        const pow=sp?28:17+Math.random()*6;
        ball.userData.owned=false;ball.userData.owner=null;p.hasBall=false;
        ball.userData.vx=dir.x*pow;ball.userData.vy=3.5+Math.random()*4;ball.userData.vz=dir.z*pow;
        if(sp){spawnSpecialFX(ball.position.clone(),p.data);setBallGlow(p.data.sc,1.8);}
        else spawnParticles(ball.position.clone(),p.data.ac,20,1.2,2,.09,.45);
      }else if(Math.random()<.005){pass(p);}
    }
  });
}

// ═══════════════════════════════════════════════════
//  CINEMATIC
// ═══════════════════════════════════════════════════
function startCinematic(dur){
  if(cinematic)return;
  cinematic=true;cinTimer=dur;
  document.getElementById('cin-top').style.height='7vh';
  document.getElementById('cin-bot').style.height='7vh';
}
function tickCinematic(dt){
  if(!cinematic)return;
  cinTimer-=dt;
  if(cinTimer<=0){
    cinematic=false;
    document.getElementById('cin-top').style.height='0';
    document.getElementById('cin-bot').style.height='0';
  }
}

// ═══════════════════════════════════════════════════
//  CAMERA
// ═══════════════════════════════════════════════════
function tickCamera(dt){
  if(!ctrl)return;
  let tx,ty,tz,lx,lz;
  if(cinematic){
    // Low dramatic angle for special shot
    tx=ball.position.x*.3+ctrl.pos.x*.7;
    ty=5;
    tz=ctrl.pos.z+14;
    lx=ball.position.x*.5;lz=ball.position.z;
    ty=8;
  }else{
    tx=ctrl.pos.x*.35;ty=20;tz=ctrl.pos.z+26;
    lx=ctrl.pos.x*.18;lz=ctrl.pos.z-3;
  }
  const lspd=cinematic?dt*8:dt*3.5;
  cam.position.x+=(tx-cam.position.x)*lspd;
  cam.position.y+=(ty-cam.position.y)*lspd;
  cam.position.z+=(tz-cam.position.z)*lspd;
  cam.lookAt(new THREE.Vector3(lx,0,lz));
}

// ═══════════════════════════════════════════════════
//  HUD
// ═══════════════════════════════════════════════════
function showSpecialShot(data){
  const n=document.getElementById('snm');
  const s=document.getElementById('spl');
  n.textContent=data.special;
  n.style.color='#'+data.sc.toString(16).padStart(6,'0');
  n.style.textShadow=`0 0 24px #${data.sc.toString(16).padStart(6,'0')}, 0 0 50px #${data.ac.toString(16).padStart(6,'0')}`;
  s.textContent=data.name;
  n.style.opacity='1';s.style.opacity='1';
  setTimeout(()=>{n.style.opacity='0';s.style.opacity='0';},2000);
}

function updateHUD(){
  if(!ctrl)return;
  document.getElementById('pname').textContent=ctrl.data.name;
  document.getElementById('ppos').textContent=ctrl.data.role+' · #'+ctrl.data.num;
  const pct=Math.round(gauge);
  document.getElementById('gfill').style.width=pct+'%';
  document.getElementById('gpct').textContent=pct+'%';
  document.getElementById('gfill').style.boxShadow=gauge>=55?'0 0 12px #0af,0 0 24px #06f':'0 0 6px #0af';
}

function tickTimer(dt){
  gTime+=dt;
  const half=gTime<2700?'1ST':'2ND';
  const t=gTime<2700?gTime:gTime-2700;
  const m=String(Math.floor(t/60)).padStart(2,'0');
  const s=String(Math.floor(t%60)).padStart(2,'0');
  document.getElementById('timer').textContent=`${half} HALF — ${m}:${s}`;
}

function tickMinimap(){
  const ctx=mmCtx;
  const W=170,H=108;
  ctx.clearRect(0,0,W,H);
  // Field
  ctx.fillStyle='#0a2a0a';ctx.fillRect(0,0,W,H);
  // Lines
  ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=1;
  ctx.strokeRect(2,2,W-4,H-4);
  ctx.beginPath();ctx.moveTo(2,H/2);ctx.lineTo(W-2,H/2);ctx.stroke();
  // Goals
  ctx.fillStyle='#fff';
  ctx.fillRect(W/2-6,1,12,4);ctx.fillRect(W/2-6,H-5,12,4);

  const mx=(x)=>(x+FW/2)/FW*W;
  const mz=(z)=>(z+FL/2)/FL*H;

  // Balls
  players.forEach(p=>{
    ctx.beginPath();ctx.arc(mx(p.pos.x),mz(p.pos.z),p===ctrl?6:3.5,0,Math.PI*2);
    if(p.hasBall)ctx.fillStyle='#ffff00';
    else ctx.fillStyle=p.team===0?'#00aaff':'#ff3355';
    ctx.fill();
    if(p===ctrl){ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();}
  });
  ctx.beginPath();ctx.arc(mx(ball.position.x),mz(ball.position.z),3.5,0,Math.PI*2);
  ctx.fillStyle='#ffffff';ctx.fill();
}

// ═══════════════════════════════════════════════════
//  GAME LOOP
// ═══════════════════════════════════════════════════
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),.05);

  handleInput(dt);
  tickAI(dt);
  tickBall(dt);
  tickParticles(dt);
  tickCamera(dt);
  tickCinematic(dt);
  tickMinimap();
  tickTimer(dt);
  updateHUD();

  ren.render(scene,cam);
}

init();
</script>
</body>
