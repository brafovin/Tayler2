<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLUE LOCK 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; font-family: 'Arial Black', sans-serif; }
  #gameCanvas { display: block; }
  #hud {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 10;
  }
  #scoreboard {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    background: linear-gradient(135deg, rgba(0,10,40,0.95), rgba(0,30,80,0.95));
    border: 2px solid #00aaff; border-radius: 12px;
    padding: 12px 40px; text-align: center;
    box-shadow: 0 0 30px #00aaff88, inset 0 0 20px rgba(0,170,255,0.1);
  }
  #scoreboard .teams { display: flex; align-items: center; gap: 20px; }
  #scoreboard .team-name { color: #00aaff; font-size: 13px; font-weight: 900; letter-spacing: 2px; text-shadow: 0 0 10px #00aaff; }
  #scoreboard .score { color: #fff; font-size: 36px; font-weight: 900; text-shadow: 0 0 20px #00aaff; }
  #scoreboard .dash { color: #fff; font-size: 24px; margin: 0 10px; }
  #scoreboard .time { color: #88ccff; font-size: 12px; margin-top: 4px; letter-spacing: 3px; }
  #playerInfo {
    position: absolute; bottom: 80px; left: 20px;
    background: linear-gradient(135deg, rgba(0,10,40,0.95), rgba(0,30,80,0.9));
    border: 2px solid #00aaff; border-radius: 10px; padding: 12px 18px;
    box-shadow: 0 0 20px #00aaff55;
    min-width: 200px;
  }
  #playerInfo .player-name { color: #fff; font-size: 16px; font-weight: 900; text-shadow: 0 0 8px #00aaff; }
  #playerInfo .player-ability { color: #00aaff; font-size: 11px; margin-top: 3px; letter-spacing: 1px; }
  #playerInfo .special-bar-bg {
    background: rgba(0,0,0,0.5); border: 1px solid #00aaff44;
    border-radius: 4px; height: 8px; margin-top: 8px; overflow: hidden;
  }
  #playerInfo .special-bar { background: linear-gradient(90deg, #00aaff, #0066ff, #aa00ff);
    height: 100%; border-radius: 4px; transition: width 0.3s;
    box-shadow: 0 0 6px #00aaff;
  }
  #playerInfo .special-label { color: #88ccff; font-size: 9px; margin-top: 3px; letter-spacing: 2px; }
  #controls {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 12px; align-items: center;
  }
  .ctrl-btn {
    background: rgba(0,10,40,0.9); border: 1px solid #00aaff44;
    border-radius: 8px; padding: 6px 12px;
    color: #88ccff; font-size: 11px; letter-spacing: 1px;
  }
  .ctrl-btn span { color: #fff; font-weight: 900; }
  #notification {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    text-align: center; pointer-events: none; transition: opacity 0.5s;
  }
  #notification .goal-text {
    font-size: 80px; font-weight: 900; color: #fff;
    text-shadow: 0 0 40px #00aaff, 0 0 80px #00aaff, 0 0 120px #0044ff;
    letter-spacing: 10px; animation: goalPulse 0.3s ease-in-out infinite alternate;
  }
  #notification .scorer-text {
    font-size: 22px; color: #00aaff;
    text-shadow: 0 0 15px #00aaff; letter-spacing: 3px; margin-top: 5px;
  }
  @keyframes goalPulse { from { transform: scale(1); } to { transform: scale(1.08); } }
  #specialEffect {
    position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
    text-align: center; pointer-events: none;
  }
  #specialEffect .shot-name {
    font-size: 42px; font-weight: 900; letter-spacing: 4px;
    opacity: 0; transition: opacity 0.2s;
  }
  #minimap {
    position: absolute; bottom: 20px; right: 20px;
    width: 160px; height: 100px;
    background: rgba(0,10,30,0.85); border: 2px solid #00aaff55;
    border-radius: 8px; overflow: hidden;
  }
  #minimap canvas { width: 100%; height: 100%; }
  #blueLockTitle {
    position: absolute; top: 20px; left: 20px;
    color: #00aaff; font-size: 11px; font-weight: 900;
    letter-spacing: 4px; text-shadow: 0 0 10px #00aaff;
    opacity: 0.7;
  }
  #teamSelect {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(ellipse at center, #001030 0%, #000008 100%);
    z-index: 100; display: flex; flex-direction: column;
    align-items: center; justify-content: center; overflow-y: auto;
  }
  #teamSelect h1 {
    font-size: 72px; font-weight: 900; color: #00aaff;
    text-shadow: 0 0 40px #00aaff, 0 0 80px #0044ff;
    letter-spacing: 8px; margin-bottom: 10px;
  }
  #teamSelect h2 { color: #fff; font-size: 16px; letter-spacing: 6px; margin-bottom: 50px; opacity: 0.7; }
  #teamSelect .player-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
    max-width: 900px; width: 90%; margin-bottom: 30px;
  }
  .player-card {
    background: linear-gradient(135deg, rgba(0,20,60,0.9), rgba(0,10,30,0.9));
    border: 2px solid #00aaff44; border-radius: 12px; padding: 16px;
    cursor: pointer; transition: all 0.2s; text-align: center;
  }
  .player-card:hover, .player-card.selected {
    border-color: #00aaff; box-shadow: 0 0 20px #00aaff66;
    transform: translateY(-3px);
  }
  .player-card .num { font-size: 28px; font-weight: 900; color: #00aaff; text-shadow: 0 0 10px #00aaff; }
  .player-card .pname { color: #fff; font-size: 13px; font-weight: 700; margin-top: 4px; }
  .player-card .prole { color: #88ccff; font-size: 10px; letter-spacing: 1px; margin-top: 2px; }
  .player-card .pspecial { color: #ff4488; font-size: 10px; margin-top: 6px; font-style: italic; }
  .start-btn {
    background: linear-gradient(135deg, #0044ff, #0088ff);
    border: none; border-radius: 12px; padding: 18px 60px;
    color: #fff; font-size: 20px; font-weight: 900; letter-spacing: 4px;
    cursor: pointer; box-shadow: 0 0 30px #0066ff88;
    transition: all 0.2s; margin-top: 10px;
  }
  .start-btn:hover { box-shadow: 0 0 50px #00aaff; transform: scale(1.05); }
  .section-title { color: #00aaff; font-size: 12px; letter-spacing: 4px; margin-bottom: 16px; text-align: center; }
  #loadingScreen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #000010; z-index: 200;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  #loadingScreen h1 { color: #00aaff; font-size: 60px; font-weight: 900; letter-spacing: 8px; text-shadow: 0 0 40px #00aaff; }
  #loadingScreen .loading-bar-bg { width: 400px; height: 4px; background: #001; margin-top: 30px; border-radius: 2px; }
  #loadingScreen .loading-bar { height: 100%; background: linear-gradient(90deg, #0044ff, #00aaff); border-radius: 2px; width: 0%; transition: width 0.3s; box-shadow: 0 0 10px #00aaff; }
  #loadingScreen .loading-text { color: #88ccff; font-size: 13px; letter-spacing: 3px; margin-top: 16px; }
</style>
</head>
<body>

<div id="loadingScreen">
  <h1>BLUE LOCK</h1>
  <div style="color:#88ccff;font-size:14px;letter-spacing:4px;margin-top:10px;">3D FOOTBALL SIMULATOR</div>
  <div class="loading-bar-bg"><div class="loading-bar" id="loadBar"></div></div>
  <div class="loading-text" id="loadText">INITIALIZING...</div>
</div>

<div id="teamSelect" style="display:none;">
  <h1>BLUE LOCK</h1>
  <h2>CHOOSE YOUR STRIKER</h2>
  <div class="section-title">— BLUE LOCK TEAM —</div>
  <div class="player-grid" id="playerGrid"></div>
  <button class="start-btn" onclick="startGame()">ANSTOSS ▶</button>
</div>

<canvas id="gameCanvas"></canvas>

<div id="hud" style="display:none;">
  <div id="blueLockTitle">BLUE LOCK // 3D</div>
  <div id="scoreboard">
    <div class="teams">
      <div class="team-name">BLUE LOCK</div>
      <div class="score"><span id="scoreHome">0</span><span class="dash"> — </span><span id="scoreAway">0</span></div>
      <div class="team-name">NEO EGOIST</div>
    </div>
    <div class="time" id="gameTime">1ST HALF — 00:00</div>
  </div>
  <div id="playerInfo">
    <div class="player-name" id="hudPlayerName">ISAGI YOICHI</div>
    <div class="player-ability" id="hudAbility">⚡ META VISION</div>
    <div class="special-bar-bg"><div class="special-bar" id="specialBar" style="width:0%"></div></div>
    <div class="special-label">SPECIAL SHOT GAUGE</div>
  </div>
  <div id="controls">
    <div class="ctrl-btn"><span>WASD</span> BEWEGEN</div>
    <div class="ctrl-btn"><span>LEERTASTE</span> SCHUSS</div>
    <div class="ctrl-btn"><span>E</span> PASS</div>
    <div class="ctrl-btn"><span>Q</span> SPECIAL SHOT</div>
    <div class="ctrl-btn"><span>SHIFT</span> SPRINT</div>
    <div class="ctrl-btn"><span>TAB</span> SPIELER WECHSEL</div>
  </div>
  <div id="notification" style="opacity:0;">
    <div class="goal-text">GOAL!</div>
    <div class="scorer-text" id="scorerText"></div>
  </div>
  <div id="specialEffect">
    <div class="shot-name" id="shotName"></div>
  </div>
  <div id="minimap"><canvas id="minimapCanvas" width="160" height="100"></canvas></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ============================================================
// BLUE LOCK DATA
// ============================================================
const BLUE_LOCK_PLAYERS = [
  { id: 0,  name: "ISAGI YOICHI",     num: 11, role: "CF",  special: "META VISION SHOT",       color: 0x0055ff, aura: 0x00aaff, shotColor: 0x00ddff },
  { id: 1,  name: "BACHIRA MEGURU",   num: 8,  role: "LW",  special: "MONSTER DRIBBLE SHOT",   color: 0x6600cc, aura: 0xaa00ff, shotColor: 0xcc44ff },
  { id: 2,  name: "NAGI SEISHIRO",    num: 7,  role: "CAM", special: "LAZY GENIUS TRAP SHOT",  color: 0x00aaaa, aura: 0x00ffee, shotColor: 0x44ffdd },
  { id: 3,  name: "CHIGIRI HYOMA",    num: 10, role: "RW",  special: "CRIMSON SPEED SHOT",     color: 0xcc0022, aura: 0xff2244, shotColor: 0xff6688 },
  { id: 4,  name: "KUNIGAMI RENSUKE", num: 9,  role: "ST",  special: "TRUE GOD STRIKE",        color: 0xff8800, aura: 0xffaa00, shotColor: 0xffcc44 },
  { id: 5,  name: "BAROU SHOUEI",     num: 4,  role: "CF",  special: "KING'S CANNON SHOT",     color: 0x990000, aura: 0xff0000, shotColor: 0xff4400 },
  { id: 6,  name: "YUKIMIYA KENYU",   num: 16, role: "RW",  special: "ELEGANT CURVE SHOT",     color: 0x004400, aura: 0x00ff44, shotColor: 0x66ff88 },
  { id: 7,  name: "RAICHI JINGO",     num: 20, role: "LW",  special: "BERSERKER BLAST",        color: 0x441100, aura: 0xff6600, shotColor: 0xff8844 },
  { id: 8,  name: "GAGAMARU GIN",     num: 1,  role: "GK",  special: "GUARDIAN CATCH RELEASE", color: 0x333333, aura: 0x888888, shotColor: 0xaaaaaa },
  { id: 9,  name: "NARUHAYA ASAHI",   num: 14, role: "CM",  special: "MAGNETIC CONTROL SHOT",  color: 0x005588, aura: 0x0088cc, shotColor: 0x44aaee },
  { id: 10, name: "IEMON OKUHITO",    num: 19, role: "CB",  special: "INTERCEPTOR LAUNCH",     color: 0x224400, aura: 0x44aa00, shotColor: 0x88dd22 },
];

const NEO_EGOIST_PLAYERS = [
  { id: 11, name: "KAISER MICHAEL",   num: 10, role: "CF",  special: "KAISER IMPACT",          color: 0x330066, aura: 0x8800ff, shotColor: 0xaa44ff },
  { id: 12, name: "NESS ALEXIS",      num: 8,  role: "CAM", special: "MIRROR PASS SHOT",       color: 0x002244, aura: 0x0066aa, shotColor: 0x4499cc },
  { id: 13, name: "SHIDOU RYUSEI",    num: 9,  role: "ST",  special: "CHAOTIC DIRECT SHOT",    color: 0x440000, aura: 0xff2200, shotColor: 0xff6633 },
  { id: 14, name: "REO MIKAGE",       num: 5,  role: "CM",  special: "COPY ABILITY SHOT",      color: 0x003344, aura: 0x0088cc, shotColor: 0x33bbdd },
  { id: 15, name: "LOCO WOLFF",       num: 7,  role: "LW",  special: "LOCO TORNADO SHOT",      color: 0x444400, aura: 0xffff00, shotColor: 0xffee44 },
  { id: 16, name: "ADAM BLAKE",       num: 11, role: "RW",  special: "GRAVITY SHOT",           color: 0x002200, aura: 0x00ff00, shotColor: 0x44ff44 },
  { id: 17, name: "HIORI YO",         num: 16, role: "CM",  special: "SPATIAL AWARENESS SHOT", color: 0x001133, aura: 0x4488ff, shotColor: 0x88aaff },
  { id: 18, name: "TABITO KARASU",    num: 6,  role: "CM",  special: "RAVEN SHOT",             color: 0x111111, aura: 0x555555, shotColor: 0x8888aa },
  { id: 19, name: "NEO GK",           num: 1,  role: "GK",  special: "POWER SAVE",             color: 0x222222, aura: 0x666666, shotColor: 0x999999 },
  { id: 20, name: "NEO DEF 1",        num: 2,  role: "CB",  special: "TACKLE SHOT",            color: 0x001122, aura: 0x003366, shotColor: 0x2255aa },
  { id: 21, name: "NEO DEF 2",        num: 3,  role: "CB",  special: "COUNTER LAUNCH",         color: 0x001122, aura: 0x003366, shotColor: 0x2255aa },
];

// ============================================================
// GAME STATE
// ============================================================
let selectedPlayerIndex = 0;
let gameRunning = false;
let scene, camera, renderer, clock;
let ball, players = [];
let keys = {};
let controlledPlayer = null;
let scoreHome = 0, scoreAway = 0;
let gameTimeSeconds = 0;
let specialGauge = 0;
let particles = [];
const FIELD_W = 68, FIELD_L = 105, GOAL_W = 7.32, GOAL_H = 2.44;

// ============================================================
// LOADING
// ============================================================
function loadProgress(pct, text) {
  document.getElementById('loadBar').style.width = pct + '%';
  document.getElementById('loadText').textContent = text;
}

async function init() {
  loadProgress(10, 'LOADING THREE.JS...');
  await sleep(100);
  loadProgress(30, 'BUILDING STADIUM...');
  setupScene();
  loadProgress(50, 'CREATING PLAYERS...');
  await sleep(100);
  loadProgress(70, 'LOADING EFFECTS...');
  await sleep(100);
  loadProgress(90, 'FINAL SETUP...');
  document.getElementById('minimapCanvas').getContext('2d');
  await sleep(200);
  loadProgress(100, 'BEREIT!');
  await sleep(400);
  document.getElementById('loadingScreen').style.display = 'none';
  showPlayerSelect();
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ============================================================
// PLAYER SELECT
// ============================================================
function showPlayerSelect() {
  const grid = document.getElementById('playerGrid');
  grid.innerHTML = '';
  BLUE_LOCK_PLAYERS.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'player-card' + (i === selectedPlayerIndex ? ' selected' : '');
    card.innerHTML = `<div class="num">#${p.num}</div>
      <div class="pname">${p.name}</div>
      <div class="prole">${p.role}</div>
      <div class="pspecial">${p.special}</div>`;
    card.onclick = () => {
      document.querySelectorAll('.player-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      selectedPlayerIndex = i;
    };
    grid.appendChild(card);
  });
  document.getElementById('teamSelect').style.display = 'flex';
}

function startGame() {
  document.getElementById('teamSelect').style.display = 'none';
  document.getElementById('hud').style.display = 'block';
  buildGame();
  gameRunning = true;
  gameLoop();
}

// ============================================================
// SCENE SETUP
// ============================================================
function setupScene() {
  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x001020, 0.018);
  scene.background = new THREE.Color(0x000810);

  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
  camera.position.set(0, 18, 30);
  camera.lookAt(0, 0, 0);

  renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gameCanvas'), antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.9;

  clock = new THREE.Clock();

  const ambient = new THREE.AmbientLight(0x112244, 0.8);
  scene.add(ambient);

  const sun = new THREE.DirectionalLight(0xffffff, 1.2);
  sun.position.set(20, 40, 20);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.near = 0.5;
  sun.shadow.camera.far = 200;
  sun.shadow.camera.left = -80;
  sun.shadow.camera.right = 80;
  sun.shadow.camera.top = 80;
  sun.shadow.camera.bottom = -80;
  scene.add(sun);

  [-20, 20].forEach(x => {
    [-40, 40].forEach(z => {
      const spot = new THREE.PointLight(0x6699ff, 1.5, 120);
      spot.position.set(x, 35, z);
      scene.add(spot);
    });
  });

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'Tab') { e.preventDefault(); if (gameRunning) switchPlayer(); }
  });
  window.addEventListener('keyup', e => { keys[e.code] = false; });
}

// ============================================================
// BUILD GAME WORLD
// ============================================================
function buildGame() {
  buildField();
  buildStadium();
  buildGoals();
  buildBall();
  buildAllPlayers();
  updateHUD();
}

function buildField() {
  const mat = new THREE.MeshLambertMaterial({ color: 0x0a3a0a });
  const field = new THREE.Mesh(new THREE.PlaneGeometry(FIELD_W + 10, FIELD_L + 10, 20, 30), mat);
  field.rotation.x = -Math.PI / 2;
  field.receiveShadow = true;
  scene.add(field);

  for (let i = 0; i < 10; i++) {
    const stripe = new THREE.Mesh(
      new THREE.PlaneGeometry(FIELD_W, FIELD_L / 10),
      new THREE.MeshLambertMaterial({ color: i % 2 === 0 ? 0x0d4a0d : 0x0a3a0a })
    );
    stripe.rotation.x = -Math.PI / 2;
    stripe.position.set(0, 0.01, -FIELD_L/2 + FIELD_L/20 + i * FIELD_L/10);
    scene.add(stripe);
  }

  const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff, opacity: 0.9, transparent: true });
  function addLine(x1, z1, x2, z2, w) {
    w = w || 0.12;
    const dx = x2 - x1, dz = z2 - z1;
    const len = Math.sqrt(dx*dx + dz*dz);
    const ang = Math.atan2(dx, dz);
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, len), lineMat);
    m.rotation.x = -Math.PI / 2;
    m.rotation.z = -ang;
    m.position.set((x1+x2)/2, 0.02, (z1+z2)/2);
    scene.add(m);
  }
  const hw = FIELD_W/2, hl = FIELD_L/2;
  addLine(-hw, -hl, hw, -hl); addLine(-hw, hl, hw, hl);
  addLine(-hw, -hl, -hw, hl); addLine(hw, -hl, hw, hl);
  addLine(-hw, 0, hw, 0);

  const ccGeo = new THREE.RingGeometry(9.15, 9.27, 64);
  const cc = new THREE.Mesh(ccGeo, lineMat);
  cc.rotation.x = -Math.PI / 2; cc.position.y = 0.02; scene.add(cc);
  const cdot = new THREE.Mesh(new THREE.CircleGeometry(0.3, 16), lineMat);
  cdot.rotation.x = -Math.PI/2; cdot.position.y = 0.02; scene.add(cdot);

  [-1, 1].forEach(side => {
    const pz = side * hl, psign = -side;
    addLine(-20.15, pz, 20.15, pz);
    addLine(-20.15, pz, -20.15, pz + psign * 16.5);
    addLine(20.15, pz, 20.15, pz + psign * 16.5);
    addLine(-20.15, pz + psign*16.5, 20.15, pz + psign*16.5);
    addLine(-9.16, pz, 9.16, pz);
    addLine(-9.16, pz, -9.16, pz + psign * 5.5);
    addLine(9.16, pz, 9.16, pz + psign * 5.5);
    addLine(-9.16, pz + psign*5.5, 9.16, pz + psign*5.5);
    const pspot = new THREE.Mesh(new THREE.CircleGeometry(0.25, 12), lineMat);
    pspot.rotation.x = -Math.PI/2; pspot.position.set(0, 0.02, pz + psign * 11); scene.add(pspot);
    const arcGeo = new THREE.RingGeometry(9.15, 9.27, 64, 1, 0, Math.PI);
    const arc = new THREE.Mesh(arcGeo, lineMat);
    arc.rotation.x = -Math.PI/2; arc.rotation.z = side > 0 ? 0 : Math.PI;
    arc.position.set(0, 0.02, pz + psign * 11); scene.add(arc);
  });
}

function buildStadium() {
  const standMat = new THREE.MeshLambertMaterial({ color: 0x001525 });
  [
    { w: FIELD_W + 20, d: 4, x: 0, z: -(FIELD_L/2 + 14) },
    { w: FIELD_W + 20, d: 4, x: 0, z: FIELD_L/2 + 14 },
    { w: 4, d: FIELD_L + 20, x: -(FIELD_W/2 + 14), z: 0 },
    { w: 4, d: FIELD_L + 20, x: FIELD_W/2 + 14, z: 0 },
  ].forEach(p => {
    const stand = new THREE.Mesh(new THREE.BoxGeometry(p.w, 12, p.d), standMat);
    stand.position.set(p.x, 6, p.z); scene.add(stand);
  });

  [[-30,-48],[30,-48],[-30,48],[30,48]].forEach(([x,z]) => {
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.3,40), new THREE.MeshLambertMaterial({color:0x222233}));
    pole.position.set(x, 20, z); scene.add(pole);
    const lamp = new THREE.Mesh(new THREE.BoxGeometry(3,0.5,1.5), new THREE.MeshBasicMaterial({color:0xffffee}));
    lamp.position.set(x, 40, z); scene.add(lamp);
  });

  const starGeo = new THREE.BufferGeometry();
  const starPos = [];
  for (let i = 0; i < 2000; i++) {
    starPos.push((Math.random()-0.5)*600, 100+Math.random()*100, (Math.random()-0.5)*600);
  }
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
  scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({color:0xffffff,size:0.5})));
}

function buildGoals() {
  const postMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
  [-1, 1].forEach(side => {
    const group = new THREE.Group();
    const postGeo = new THREE.CylinderGeometry(0.06, 0.06, GOAL_H);
    [-GOAL_W/2, GOAL_W/2].forEach(x => {
      const post = new THREE.Mesh(postGeo, postMat);
      post.position.set(x, GOAL_H/2, 0); post.castShadow = true; group.add(post);
    });
    const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,GOAL_W+0.12), postMat);
    bar.rotation.z = Math.PI/2; bar.position.set(0, GOAL_H, 0); group.add(bar);
    const netMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, opacity: 0.3, transparent: true });
    const net = new THREE.Mesh(new THREE.BoxGeometry(GOAL_W, GOAL_H, 1.5), netMat);
    net.position.set(0, GOAL_H/2, -side*0.75); group.add(net);
    group.position.set(0, 0, side * FIELD_L/2);
    scene.add(group);
  });
}

function buildBall() {
  const geo = new THREE.SphereGeometry(0.22, 16, 16);
  const mat = new THREE.MeshPhongMaterial({ color: 0xffffff, shininess: 80, emissive: 0x001133, emissiveIntensity: 0.1 });
  ball = new THREE.Mesh(geo, mat);
  ball.castShadow = true;
  ball.position.set(0, 0.22, 0);
  ball.userData = { vx: 0, vy: 0, vz: 0, controlled: false, owner: null };
  scene.add(ball);
}

function createPlayerMesh(playerData, team) {
  const group = new THREE.Group();
  const isHome = team === 0;
  const baseColor = playerData.color;
  const role = playerData.role;

  const bodyMat = new THREE.MeshPhongMaterial({ color: baseColor, shininess: 30, emissive: baseColor, emissiveIntensity: 0.15 });
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.18, 0.7), bodyMat);
  body.position.y = 0.95; body.castShadow = true; group.add(body);

  const headMat = new THREE.MeshPhongMaterial({ color: 0xffcca0, shininess: 20 });
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 12, 10), headMat);
  head.position.y = 1.55; head.castShadow = true; group.add(head);

  const hairMat = new THREE.MeshPhongMaterial({ color: isHome ? 0x111111 : 0x222200 });
  const hair = new THREE.Mesh(new THREE.SphereGeometry(0.21, 12, 10, 0, Math.PI*2, 0, Math.PI/2), hairMat);
  hair.position.y = 1.55; group.add(hair);

  const legMat = new THREE.MeshPhongMaterial({ color: isHome ? 0x001a66 : 0x1a0033 });
  [-0.1, 0.1].forEach((x) => {
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.09, 0.55), legMat);
    leg.position.set(x, 0.37, 0); group.add(leg);
    const foot = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.08, 0.22), new THREE.MeshPhongMaterial({color:0x111111}));
    foot.position.set(x, 0.1, 0.06); group.add(foot);
  });

  [-0.3, 0.3].forEach(x => {
    const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.06, 0.45), bodyMat);
    arm.position.set(x, 1.05, 0); arm.rotation.z = x < 0 ? 0.3 : -0.3; group.add(arm);
  });

  if (role === 'GK') {
    const gloveMat = new THREE.MeshPhongMaterial({ color: 0xff6600 });
    [-0.45, 0.45].forEach(x => {
      const glove = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8), gloveMat);
      glove.position.set(x, 0.85, 0); group.add(glove);
    });
  }

  const auraGeo = new THREE.RingGeometry(0.35, 0.45, 32);
  const auraMat = new THREE.MeshBasicMaterial({ color: playerData.aura, opacity: 0.0, transparent: true, side: THREE.DoubleSide });
  const auraRing = new THREE.Mesh(auraGeo, auraMat);
  auraRing.rotation.x = -Math.PI/2; auraRing.position.y = 0.02; group.add(auraRing);
  group.userData.aura = auraRing;

  const shadow = new THREE.Mesh(new THREE.CircleGeometry(0.3, 16), new THREE.MeshBasicMaterial({color:0x000000,opacity:0.3,transparent:true}));
  shadow.rotation.x = -Math.PI/2; shadow.position.y = 0.01; group.add(shadow);

  return group;
}

function buildAllPlayers() {
  const homeFormation = [
    [0, 0, -48], [-18, 0, -35], [-6, 0, -35], [6, 0, -35], [18, 0, -35],
    [-12, 0, -20], [0, 0, -18], [12, 0, -20],
    [-8, 0, -5], [0, 0, -2], [8, 0, -5],
  ];
  const awayFormation = [
    [0, 0, 48], [-18, 0, 35], [-6, 0, 35], [6, 0, 35], [18, 0, 35],
    [-14, 0, 22], [-5, 0, 20], [5, 0, 20], [14, 0, 22],
    [-6, 0, 8], [6, 0, 8],
  ];

  BLUE_LOCK_PLAYERS.forEach((pd, i) => {
    const mesh = createPlayerMesh(pd, 0);
    const pos = homeFormation[i] || [0, 0, 0];
    mesh.position.set(pos[0], 0, pos[2]);
    scene.add(mesh);
    players.push({
      mesh, data: pd, team: 0,
      pos: new THREE.Vector3(pos[0], 0, pos[2]),
      homePos: new THREE.Vector3(pos[0], 0, pos[2]),
      hasBall: false, isControlled: false,
      animTime: Math.random() * Math.PI * 2,
    });
  });

  NEO_EGOIST_PLAYERS.forEach((pd, i) => {
    const mesh = createPlayerMesh(pd, 1);
    const pos = awayFormation[i] || [0, 0, 0];
    mesh.position.set(pos[0], 0, pos[2]);
    scene.add(mesh);
    players.push({
      mesh, data: pd, team: 1,
      pos: new THREE.Vector3(pos[0], 0, pos[2]),
      homePos: new THREE.Vector3(pos[0], 0, pos[2]),
      hasBall: false, isControlled: false,
      animTime: Math.random() * Math.PI * 2,
    });
  });

  controlledPlayer = players[selectedPlayerIndex];
  controlledPlayer.isControlled = true;
  updateHUD();
}

// ============================================================
// PARTICLES
// ============================================================
function createParticleEffect(pos, color, count, spread, speed, size, lifetime) {
  const geo = new THREE.BufferGeometry();
  const positions = new Float32Array(count * 3);
  const velocities = [];
  for (let i = 0; i < count; i++) {
    positions[i*3] = pos.x; positions[i*3+1] = pos.y + 0.5; positions[i*3+2] = pos.z;
    velocities.push(new THREE.Vector3((Math.random()-0.5)*spread, Math.random()*speed+0.5, (Math.random()-0.5)*spread));
  }
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const mat = new THREE.PointsMaterial({ color, size, sizeAttenuation: true, transparent: true, opacity: 1, depthWrite: false });
  const pts = new THREE.Points(geo, mat);
  scene.add(pts);
  particles.push({ pts, geo, velocities, lifetime, maxLife: lifetime, count });
}

function createSpecialShotEffect(pos, color, shotColor) {
  for (let r = 0; r < 3; r++) {
    setTimeout(() => {
      const ringGeo = new THREE.RingGeometry(0.5, 0.7, 32);
      const ringMat = new THREE.MeshBasicMaterial({color:shotColor,opacity:0.8,transparent:true,side:THREE.DoubleSide});
      const ring = new THREE.Mesh(ringGeo, ringMat);
      ring.position.copy(pos); ring.position.y = 0.3; ring.rotation.x = -Math.PI/2;
      scene.add(ring);
      let scale = 1;
      const anim = setInterval(() => {
        scale += 0.4; ring.scale.set(scale, scale, scale); ringMat.opacity -= 0.05;
        if (ringMat.opacity <= 0) { clearInterval(anim); scene.remove(ring); ringGeo.dispose(); ringMat.dispose(); }
      }, 30);
    }, r * 120);
  }
  createParticleEffect(pos, shotColor, 80, 6, 4, 0.15, 1.5);
  createParticleEffect(pos, color, 40, 3, 6, 0.08, 2.0);
  createParticleEffect(pos, shotColor, 30, 1, 8, 0.12, 1.0);
}

function createGoalEffect() {
  const pos = new THREE.Vector3(0, 2, 0);
  [0x00aaff, 0xffffff, 0x0044ff, 0xffaa00].forEach(c => createParticleEffect(pos, c, 100, 8, 5, 0.2, 2.5));
}

function createTrailEffect(pos, color) {
  createParticleEffect(pos.clone(), color, 5, 0.3, 0.5, 0.08, 0.4);
}

// ============================================================
// GAME LOGIC
// ============================================================
function switchPlayer() {
  const teamPlayers = players.filter(p => p.team === 0 && p.data.role !== 'GK');
  const idx = teamPlayers.indexOf(controlledPlayer);
  const next = teamPlayers[(idx + 1) % teamPlayers.length];
  if (controlledPlayer) controlledPlayer.isControlled = false;
  controlledPlayer = next;
  controlledPlayer.isControlled = true;
  updateHUD();
}

function colorToCSS(hex) { return '#' + hex.toString(16).padStart(6,'0'); }

let shootCooldown = 0, passCooldown = 0, specialCooldown = 0;

function handleInput(dt) {
  if (!controlledPlayer || !gameRunning) return;
  const p = controlledPlayer;
  const speed = (keys['ShiftLeft'] || keys['ShiftRight']) ? 12 : 7;
  const dir = new THREE.Vector3();

  if (keys['KeyW'] || keys['ArrowUp'])    dir.z -= 1;
  if (keys['KeyS'] || keys['ArrowDown'])  dir.z += 1;
  if (keys['KeyA'] || keys['ArrowLeft'])  dir.x -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) dir.x += 1;

  if (dir.length() > 0) {
    dir.normalize().multiplyScalar(speed * dt);
    p.pos.add(dir);
    p.mesh.rotation.y = Math.atan2(dir.x, dir.z);
    if (keys['ShiftLeft'] || keys['ShiftRight']) {
      p.mesh.userData.aura.material.opacity = 0.6;
    } else {
      p.mesh.userData.aura.material.opacity = 0.15;
    }
    specialGauge = Math.min(100, specialGauge + dt * 8);
  } else {
    p.mesh.userData.aura.material.opacity = 0;
  }

  p.pos.x = Math.max(-FIELD_W/2, Math.min(FIELD_W/2, p.pos.x));
  p.pos.z = Math.max(-FIELD_L/2, Math.min(FIELD_L/2, p.pos.z));
  p.mesh.position.set(p.pos.x, 0, p.pos.z);

  if (p.pos.distanceTo(ball.position) < 1.2 && !ball.userData.controlled) {
    ball.userData.controlled = true; ball.userData.owner = p; p.hasBall = true;
  }

  shootCooldown -= dt; passCooldown -= dt; specialCooldown -= dt;

  if (keys['Space'] && shootCooldown <= 0 && p.hasBall) {
    shootBall(p, false); shootCooldown = 0.8;
  }
  if (keys['KeyQ'] && specialCooldown <= 0 && p.hasBall && specialGauge >= 60) {
    shootBall(p, true); specialCooldown = 3; specialGauge = 0; showSpecialShot(p.data);
  }
  if (keys['KeyE'] && passCooldown <= 0 && p.hasBall) {
    passBall(p); passCooldown = 0.5;
  }

  updateHUD();
}

function shootBall(player, special) {
  const goalZ = player.team === 0 ? -FIELD_L/2 : FIELD_L/2;
  const dir = new THREE.Vector3((Math.random()-0.5)*0.15, 0, goalZ < 0 ? -1 : 1).normalize();
  const power = special ? 28 : 18 + Math.random() * 5;
  ball.userData.controlled = false; ball.userData.owner = null; player.hasBall = false;
  ball.userData.vx = dir.x * power;
  ball.userData.vy = special ? 8 : 4 + Math.random() * 3;
  ball.userData.vz = dir.z * power;
  if (special) {
    createSpecialShotEffect(ball.position.clone(), player.data.color, player.data.shotColor);
    addBallGlow(player.data.shotColor, 2.0);
  } else {
    createParticleEffect(ball.position.clone(), player.data.aura, 20, 1, 2, 0.1, 0.5);
  }
}

let ballGlowTimer = 0, ballGlowColor = 0xffffff;
function addBallGlow(color, dur) {
  ballGlowTimer = dur; ballGlowColor = color;
  ball.material.emissive.setHex(color); ball.material.emissiveIntensity = 1.5;
}

function passBall(player) {
  const teammates = players.filter(p => p.team === player.team && p !== player);
  if (!teammates.length) return;
  let best = null, bestScore = -Infinity;
  teammates.forEach(t => {
    const advance = player.team === 0 ? -t.pos.z : t.pos.z;
    const dist = player.pos.distanceTo(t.pos);
    if (dist > 1 && dist < 30 && advance - dist * 0.1 > bestScore) {
      bestScore = advance - dist * 0.1; best = t;
    }
  });
  if (!best) best = teammates[0];
  const dir = best.pos.clone().sub(player.pos).normalize();
  ball.userData.controlled = false; ball.userData.owner = null; player.hasBall = false;
  ball.userData.vx = dir.x * 15; ball.userData.vy = 1.5; ball.userData.vz = dir.z * 15;
  createParticleEffect(ball.position.clone(), 0x00aaff, 12, 0.5, 2, 0.08, 0.4);
}

function updateBall(dt) {
  const b = ball.userData;
  if (b.controlled && b.owner) {
    const offset = new THREE.Vector3(0, 0, b.owner.team === 0 ? -0.5 : 0.5);
    offset.applyEuler(b.owner.mesh.rotation);
    ball.position.set(b.owner.pos.x + offset.x, 0.22, b.owner.pos.z + offset.z);
    return;
  }

  b.vy -= 12 * dt;
  ball.position.x += b.vx * dt;
  ball.position.y += b.vy * dt;
  ball.position.z += b.vz * dt;

  if (ball.position.y <= 0.22) {
    ball.position.y = 0.22; b.vy = Math.abs(b.vy) * 0.45;
    b.vx *= 0.82; b.vz *= 0.82;
    if (Math.abs(b.vy) < 0.3) b.vy = 0;
  }
  if (ball.position.y <= 0.25) { b.vx *= 1 - dt * 1.8; b.vz *= 1 - dt * 1.8; }

  ball.rotation.z += b.vx * dt * 2;
  ball.rotation.x += b.vz * dt * 2;

  if (Math.sqrt(b.vx*b.vx + b.vz*b.vz) > 3) {
    createTrailEffect(ball.position, ballGlowTimer > 0 ? ballGlowColor : 0xffffff);
  }

  if (ballGlowTimer > 0) {
    ballGlowTimer -= dt;
    ball.material.emissiveIntensity = Math.max(0, (ballGlowTimer/2.0)*1.5);
    if (ballGlowTimer <= 0) { ball.material.emissive.setHex(0x001133); ball.material.emissiveIntensity = 0.1; }
  }

  if (ball.position.x < -FIELD_W/2+0.22) { ball.position.x = -FIELD_W/2+0.22; b.vx = Math.abs(b.vx)*0.6; }
  if (ball.position.x > FIELD_W/2-0.22)  { ball.position.x = FIELD_W/2-0.22;  b.vx = -Math.abs(b.vx)*0.6; }

  checkGoal();
}

let goalCooldown = 0;
function checkGoal() {
  goalCooldown -= 0.016;
  if (goalCooldown > 0) return;
  const bz = ball.position.z, bx = ball.position.x, by = ball.position.y;
  if (bz < -FIELD_L/2 && Math.abs(bx) < GOAL_W/2 && by < GOAL_H+0.3) {
    scoreHome++; document.getElementById('scoreHome').textContent = scoreHome;
    triggerGoal(controlledPlayer ? controlledPlayer.data.name : 'BLUE LOCK'); resetAfterGoal();
  } else if (bz > FIELD_L/2 && Math.abs(bx) < GOAL_W/2 && by < GOAL_H+0.3) {
    scoreAway++; document.getElementById('scoreAway').textContent = scoreAway;
    triggerGoal('NEO EGOIST'); resetAfterGoal();
  }
}

function triggerGoal(scorer) {
  goalCooldown = 4; createGoalEffect();
  document.getElementById('scorerText').textContent = scorer + ' — TOOOR!';
  const notif = document.getElementById('notification');
  notif.style.opacity = '1';
  setTimeout(() => { notif.style.opacity = '0'; }, 3000);
}

function resetAfterGoal() {
  ball.position.set(0, 0.22, 0);
  ball.userData.vx = 0; ball.userData.vy = 0; ball.userData.vz = 0;
  ball.userData.controlled = false; ball.userData.owner = null;
  players.forEach(p => { p.pos.copy(p.homePos); p.mesh.position.copy(p.homePos); p.hasBall = false; });
}

// ============================================================
// AI
// ============================================================
function updateAI(dt) {
  players.forEach(p => {
    if (p === controlledPlayer) return;
    const team = p.team;
    const goalZ = team === 0 ? -FIELD_L/2 : FIELD_L/2;
    const distToBall = p.pos.distanceTo(ball.position);
    let targetX = p.homePos.x, targetZ = p.homePos.z;

    if (distToBall < 15 && !ball.userData.controlled) {
      targetX = ball.position.x; targetZ = ball.position.z;
    } else if (ball.userData.owner && ball.userData.owner.team !== team) {
      targetX = ball.position.x + (Math.random()-0.5)*3;
      targetZ = ball.position.z + (team === 0 ? 2 : -2);
    } else if (ball.userData.owner && ball.userData.owner.team === team) {
      targetX = p.homePos.x + (Math.random()-0.5)*5;
      targetZ = p.homePos.z + (team === 0 ? -5 : 5);
    }

    const dx = targetX - p.pos.x, dz = targetZ - p.pos.z;
    const dist = Math.sqrt(dx*dx + dz*dz);
    if (dist > 0.5) {
      const spd = p.data.role === 'GK' ? 4 : 6;
      p.pos.x += (dx/dist)*spd*dt; p.pos.z += (dz/dist)*spd*dt;
      p.mesh.position.set(p.pos.x, 0, p.pos.z);
      p.mesh.rotation.y = Math.atan2(dx, dz);
    }

    if (distToBall < 1.0 && !ball.userData.controlled && !p.hasBall) {
      ball.userData.controlled = true; ball.userData.owner = p; p.hasBall = true;
    }

    if (p.hasBall) {
      const distToGoal = Math.abs(p.pos.z - goalZ);
      if (distToGoal < 20 && Math.random() < 0.008) {
        const special = Math.random() < 0.15;
        if (special) showSpecialShot(p.data);
        const dir = new THREE.Vector3((Math.random()-0.5)*0.2, 0, goalZ < 0 ? -1 : 1).normalize();
        const power = special ? 25 : 16 + Math.random()*6;
        ball.userData.controlled = false; ball.userData.owner = null; p.hasBall = false;
        ball.userData.vx = dir.x*power; ball.userData.vy = 3+Math.random()*4; ball.userData.vz = dir.z*power;
        if (special) { createSpecialShotEffect(ball.position.clone(), p.data.color, p.data.shotColor); addBallGlow(p.data.shotColor, 1.5); }
      } else if (Math.random() < 0.004) {
        passBall(p);
      }
    }

    p.animTime += dt * 4;
    p.mesh.children.forEach((c, ci) => {
      if (ci === 2 || ci === 3) { c.position.z = Math.sin(p.animTime + ci * Math.PI) * 0.08; }
    });
  });
}

// ============================================================
// SPECIAL SHOT DISPLAY
// ============================================================
function showSpecialShot(playerData) {
  const el = document.getElementById('shotName');
  el.textContent = playerData.special;
  el.style.color = colorToCSS(playerData.shotColor);
  el.style.textShadow = `0 0 20px ${colorToCSS(playerData.shotColor)}, 0 0 40px ${colorToCSS(playerData.shotColor)}`;
  el.style.opacity = '1';
  setTimeout(() => { el.style.opacity = '0'; }, 1800);
}

// ============================================================
// PARTICLES UPDATE
// ============================================================
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.lifetime -= dt;
    if (p.lifetime <= 0) {
      scene.remove(p.pts); p.pts.geometry.dispose(); p.pts.material.dispose();
      particles.splice(i, 1); continue;
    }
    const positions = p.geo.attributes.position.array;
    for (let j = 0; j < p.count; j++) {
      positions[j*3]   += p.velocities[j].x * dt;
      positions[j*3+1] += p.velocities[j].y * dt;
      positions[j*3+2] += p.velocities[j].z * dt;
      p.velocities[j].y -= 4 * dt;
    }
    p.geo.attributes.position.needsUpdate = true;
    p.pts.material.opacity = p.lifetime / p.maxLife;
  }
}

// ============================================================
// CAMERA
// ============================================================
function updateCamera(dt) {
  if (!controlledPlayer) return;
  const target = controlledPlayer.pos;
  const desiredPos = new THREE.Vector3(target.x * 0.4, 18, target.z + 22);
  camera.position.lerp(desiredPos, dt * 3);
  camera.lookAt(new THREE.Vector3(target.x * 0.2, 0, target.z - 2));
}

// ============================================================
// MINIMAP
// ============================================================
function updateMinimap() {
  const ctx = document.getElementById('minimapCanvas').getContext('2d');
  const W = 160, H = 100;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#0a2a0a'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.strokeRect(0, 0, W, H);
  ctx.beginPath(); ctx.moveTo(0, H/2); ctx.lineTo(W, H/2);
  ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.fillRect(W/2-5, 0, 10, 3); ctx.fillRect(W/2-5, H-3, 10, 3);

  function toMini(x, z) { return [(x+FIELD_W/2)/FIELD_W*W, (z+FIELD_L/2)/FIELD_L*H]; }

  players.forEach(p => {
    const [mx, mz] = toMini(p.pos.x, p.pos.z);
    ctx.beginPath(); ctx.arc(mx, mz, p === controlledPlayer ? 5 : 3, 0, Math.PI*2);
    ctx.fillStyle = p.hasBall ? '#ffff00' : (p.team === 0 ? '#0088ff' : '#ff2244');
    ctx.fill();
  });

  const [bx, bz] = toMini(ball.position.x, ball.position.z);
  ctx.beginPath(); ctx.arc(bx, bz, 3, 0, Math.PI*2);
  ctx.fillStyle = '#ffffff'; ctx.fill();
}

// ============================================================
// HUD
// ============================================================
function updateHUD() {
  if (!controlledPlayer) return;
  document.getElementById('hudPlayerName').textContent = controlledPlayer.data.name;
  document.getElementById('hudAbility').textContent = '⚡ ' + controlledPlayer.data.special;
  document.getElementById('specialBar').style.width = specialGauge + '%';
}

function updateTimer(dt) {
  gameTimeSeconds += dt;
  const half = gameTimeSeconds < 2700 ? '1ST' : '2ND';
  const dispTime = gameTimeSeconds < 2700 ? gameTimeSeconds : gameTimeSeconds - 2700;
  const m = Math.floor(dispTime/60).toString().padStart(2,'0');
  const s = Math.floor(dispTime%60).toString().padStart(2,'0');
  document.getElementById('gameTime').textContent = `${half} HALF — ${m}:${s}`;
}

// ============================================================
// GAME LOOP
// ============================================================
function gameLoop() {
  if (!gameRunning) return;
  requestAnimationFrame(gameLoop);
  const dt = Math.min(clock.getDelta(), 0.05);

  handleInput(dt);
  updateAI(dt);
  updateBall(dt);
  updateParticles(dt);
  updateCamera(dt);
  updateMinimap();
  updateTimer(dt);

  if (controlledPlayer) {
    controlledPlayer.animTime += dt * 5;
    controlledPlayer.mesh.children.forEach((c, ci) => {
      if (ci === 2 || ci === 3) {
        c.position.z = Math.sin(controlledPlayer.animTime + ci * Math.PI) * 0.1;
      }
    });
  }

  renderer.render(scene, camera);
}

// ============================================================
// START
// ============================================================
init();
</script>
