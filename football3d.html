<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>⚽ 3D Fußball – 11 vs 11</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
canvas { display: block; }
#ui {
  position: fixed; top: 0; left: 0; width: 100%; z-index: 10;
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 24px;
  background: linear-gradient(to bottom, rgba(0,0,0,0.75), transparent);
}
#score {
  font-size: 2.2rem; font-weight: 900; color: #fff;
  text-shadow: 0 0 20px rgba(255,255,100,0.8);
  letter-spacing: 6px;
}
#timer { font-size: 1.1rem; color: #aef; }
#controls {
  position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,0.6); border-radius: 12px; padding: 10px 20px;
  color: #ccc; font-size: 0.8rem; text-align: center; z-index: 10;
}
#goal-banner {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
  font-size: 5rem; font-weight: 900; color: #FFD700;
  text-shadow: 0 0 40px #ff6600, 0 0 80px #ff0000;
  z-index: 20; display: none; pointer-events: none;
  animation: goalPulse 0.5s ease-in-out infinite alternate;
}
@keyframes goalPulse { from { transform: translate(-50%,-50%) scale(1); } to { transform: translate(-50%,-50%) scale(1.15); } }
#team-labels { display: flex; gap: 40px; }
.team-label { font-size: 0.85rem; font-weight: bold; padding: 4px 12px; border-radius: 6px; }
#t1 { background: rgba(30,100,255,0.5); color: #8af; }
#t2 { background: rgba(255,30,30,0.5); color: #f88; }
</style>
</head>
<body>
<div id="ui">
  <div id="team-labels">
    <div class="team-label" id="t1">🔵 BLAU</div>
    <div class="team-label" id="t2">🔴 ROT</div>
  </div>
  <div id="score"><span id="s1">0</span> – <span id="s2">0</span></div>
  <div id="timer">⏱ 00:00</div>
</div>
<div id="goal-banner">⚽ TOR!</div>
<div id="controls">
  WASD / Pfeiltasten: Kamera bewegen &nbsp;|&nbsp; Maus: Drehen &nbsp;|&nbsp; Scroll: Zoom &nbsp;|&nbsp; SPACE: Pause
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ─── Scene Setup ───────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);
scene.fog = new THREE.Fog(0x1a1a2e, 80, 200);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 500);
camera.position.set(0, 35, 60);
camera.lookAt(0, 0, 0);

// ─── Lights ────────────────────────────────────────────────────────────────
const ambient = new THREE.AmbientLight(0x334466, 0.6);
scene.add(ambient);

function makeLight(x, y, z) {
  const l = new THREE.SpotLight(0xfff5e0, 1.4, 200, Math.PI/4, 0.4, 1);
  l.position.set(x, y, z);
  l.castShadow = true;
  l.shadow.mapSize.set(1024, 1024);
  scene.add(l); scene.add(l.target);
  l.target.position.set(0, 0, 0);
  // Mast
  const mast = new THREE.Mesh(
    new THREE.CylinderGeometry(0.3, 0.3, y, 8),
    new THREE.MeshLambertMaterial({ color: 0x888888 })
  );
  mast.position.set(x, y/2, z);
  scene.add(mast);
  return l;
}
makeLight(-35, 28, -38); makeLight(35, 28, -38);
makeLight(-35, 28, 38); makeLight(35, 28, 38);

// ─── Pitch ─────────────────────────────────────────────────────────────────
const PITCH_W = 70, PITCH_H = 50;

// Grass
const grassGeo = new THREE.PlaneGeometry(PITCH_W, PITCH_H, 40, 30);
const grassMat = new THREE.MeshLambertMaterial({ color: 0x2d7a3a });
// Alternate strips
const pos = grassGeo.attributes.position;
for (let i = 0; i < pos.count; i++) {
  const x = pos.getX(i);
  const strip = Math.floor((x + PITCH_W/2) / (PITCH_W/10)) % 2;
  // We'll use vertex colors for stripes
}
const grass = new THREE.Mesh(grassGeo, grassMat);
grass.rotation.x = -Math.PI/2;
grass.receiveShadow = true;
scene.add(grass);

// Darker stripe overlay
for (let i = 0; i < 10; i++) {
  if (i % 2 === 0) continue;
  const stripe = new THREE.Mesh(
    new THREE.PlaneGeometry(PITCH_W/10 - 0.1, PITCH_H),
    new THREE.MeshLambertMaterial({ color: 0x267033, transparent: true, opacity: 0.6 })
  );
  stripe.rotation.x = -Math.PI/2;
  stripe.position.set(-PITCH_W/2 + PITCH_W/20 + i*(PITCH_W/10), 0.01, 0);
  scene.add(stripe);
}

// Field lines
function line(x1,z1,x2,z2,w=0.2) {
  const dx=x2-x1, dz=z2-z1, len=Math.sqrt(dx*dx+dz*dz);
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(w, len),
    new THREE.MeshBasicMaterial({ color: 0xffffff })
  );
  m.rotation.x = -Math.PI/2;
  m.rotation.z = Math.atan2(dx, dz);
  m.position.set((x1+x2)/2, 0.02, (z1+z2)/2);
  scene.add(m);
}
// Boundary
line(-35,-25,-35,25); line(35,-25,35,25);
line(-35,-25,35,-25); line(-35,25,35,25);
// Center
line(0,-25,0,25);
// Center circle
const circleGeo = new THREE.RingGeometry(9.7, 10, 64);
const circle = new THREE.Mesh(circleGeo, new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide }));
circle.rotation.x = -Math.PI/2; circle.position.y = 0.02;
scene.add(circle);
// Penalty boxes
function box(x0,z0,x1,z1) { line(x0,z0,x1,z0); line(x0,z1,x1,z1); line(x0,z0,x0,z1); line(x1,z0,x1,z1); }
box(-35,-11,-24,11); box(24,-11,35,11);
box(-35,-5,-30,5); box(30,-5,35,5);

// ─── Goals ─────────────────────────────────────────────────────────────────
function makeGoal(side) {
  const mat = new THREE.MeshLambertMaterial({ color: 0xffffff });
  const barGeo = new THREE.CylinderGeometry(0.15, 0.15, 8, 8);
  const postGeo = new THREE.CylinderGeometry(0.15, 0.15, 3, 8);

  const g = new THREE.Group();
  // crossbar
  const bar = new THREE.Mesh(barGeo, mat);
  bar.rotation.z = Math.PI/2; bar.position.set(0, 3, 0);
  g.add(bar);
  // posts
  [-4, 4].forEach(z => {
    const p = new THREE.Mesh(postGeo, mat);
    p.position.set(0, 1.5, z); g.add(p);
  });
  // net
  const netMat = new THREE.MeshBasicMaterial({ color: 0xcccccc, wireframe: true, transparent: true, opacity: 0.5 });
  const net = new THREE.Mesh(new THREE.BoxGeometry(2.5, 3, 8), netMat);
  net.position.set(side > 0 ? -1.25 : 1.25, 1.5, 0);
  g.add(net);

  g.position.set(side * 35, 0, 0);
  scene.add(g);
  return g;
}
makeGoal(-1); makeGoal(1);

// ─── Skybox Stars ──────────────────────────────────────────────────────────
const starGeo = new THREE.BufferGeometry();
const starVerts = [];
for (let i = 0; i < 3000; i++) {
  starVerts.push((Math.random()-0.5)*400, Math.random()*80+10, (Math.random()-0.5)*400);
}
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starVerts, 3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.3 })));

// ─── Ball ──────────────────────────────────────────────────────────────────
const ballGeo = new THREE.SphereGeometry(0.5, 16, 16);
const ballMat = new THREE.MeshPhongMaterial({ color: 0xffffff, shininess: 80 });
// Black patches
const ball = new THREE.Mesh(ballGeo, ballMat);
ball.castShadow = true; ball.position.y = 0.5;
scene.add(ball);

// Shadow blob under ball
const shadowBlob = new THREE.Mesh(
  new THREE.CircleGeometry(0.5, 16),
  new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.35 })
);
shadowBlob.rotation.x = -Math.PI/2; shadowBlob.position.y = 0.01;
scene.add(shadowBlob);

// ─── Players ───────────────────────────────────────────────────────────────
function makePlayer(color, number) {
  const g = new THREE.Group();
  // Body
  const body = new THREE.Mesh(
    new THREE.CylinderGeometry(0.35, 0.35, 1.2, 8),
    new THREE.MeshPhongMaterial({ color })
  );
  body.position.y = 1.4; body.castShadow = true; g.add(body);
  // Head
  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.35, 10, 10),
    new THREE.MeshPhongMaterial({ color: 0xffcc88 })
  );
  head.position.y = 2.25; head.castShadow = true; g.add(head);
  // Legs
  [-0.18, 0.18].forEach(x => {
    const leg = new THREE.Mesh(
      new THREE.CylinderGeometry(0.14, 0.12, 0.9, 8),
      new THREE.MeshPhongMaterial({ color: 0x222222 })
    );
    leg.position.set(x, 0.45, 0); g.add(leg);
    // Foot
    const foot = new THREE.Mesh(
      new THREE.BoxGeometry(0.18, 0.15, 0.35),
      new THREE.MeshPhongMaterial({ color: 0x111111 })
    );
    foot.position.set(x, 0.03, 0.1); g.add(foot);
  });
  // Number label (simple sphere on chest)
  const dot = new THREE.Mesh(
    new THREE.SphereGeometry(0.12, 8, 8),
    new THREE.MeshBasicMaterial({ color: 0xffffff })
  );
  dot.position.set(0, 1.6, 0.36); g.add(dot);

  g.castShadow = true;
  return g;
}

const teams = [[], []];
const formations = [
  // Team 0 (left side, attack right): GK + 4-3-3
  [[-32,0],[-22,-12],[-22,-4],[-22,4],[-22,12],[-12,-8],[-12,0],[-12,8],[-4,-10],[-4,0],[-4,10]],
  // Team 1 (right side, attack left): mirror
  [[32,0],[22,12],[22,4],[22,-4],[22,-12],[12,8],[12,0],[12,-8],[4,10],[4,0],[4,-10]],
];

[0x3399ff, 0xff3333].forEach((color, ti) => {
  formations[ti].forEach((pos, idx) => {
    const p = makePlayer(color, idx+1);
    p.position.set(pos[0], 0, pos[1]);
    p.userData = {
      team: ti, idx,
      home: new THREE.Vector3(pos[0], 0, pos[1]),
      vel: new THREE.Vector3(),
      kickCooldown: 0,
    };
    scene.add(p);
    teams[ti].push(p);
  });
});

// ─── Game State ────────────────────────────────────────────────────────────
const bPos = new THREE.Vector3(0, 0.5, 0);
const bVel = new THREE.Vector3(0.08, 0, 0.05);
let score = [0, 0];
let paused = false;
let elapsed = 0;
let goalTimer = 0;

// ─── Camera orbit ──────────────────────────────────────────────────────────
let camTheta = 0, camPhi = 0.55, camDist = 70;
let isDragging = false, lastMX = 0, lastMY = 0;
const keys = {};

renderer.domElement.addEventListener('mousedown', e => { isDragging = true; lastMX = e.clientX; lastMY = e.clientY; });
renderer.domElement.addEventListener('mouseup', () => isDragging = false);
renderer.domElement.addEventListener('mousemove', e => {
  if (!isDragging) return;
  camTheta -= (e.clientX - lastMX) * 0.005;
  camPhi   -= (e.clientY - lastMY) * 0.005;
  camPhi = Math.max(0.15, Math.min(1.2, camPhi));
  lastMX = e.clientX; lastMY = e.clientY;
});
renderer.domElement.addEventListener('wheel', e => { camDist = Math.max(20, Math.min(120, camDist + e.deltaY * 0.05)); });
document.addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'Space') paused = !paused; });
document.addEventListener('keyup', e => { keys[e.code] = false; });

// ─── Physics helpers ───────────────────────────────────────────────────────
const FRICTION = 0.985, GRAVITY = -0.01, BOUNCE = 0.55;
const HALF_W = 34.7, HALF_H = 24.7;
const GOAL_Z_HALF = 4, GOAL_Y_TOP = 3;

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function checkGoal() {
  if (bPos.x < -35 && Math.abs(bPos.z) < GOAL_Z_HALF && bPos.y < GOAL_Y_TOP) return 1; // team 1 scores
  if (bPos.x >  35 && Math.abs(bPos.z) < GOAL_Z_HALF && bPos.y < GOAL_Y_TOP) return 0; // team 0 scores
  return -1;
}

function resetPositions() {
  bPos.set(0, 0.5, 0);
  bVel.set((Math.random()-0.5)*0.1, 0, (Math.random()-0.5)*0.1);
  teams.forEach((team, ti) => team.forEach(p => {
    p.position.copy(p.userData.home);
    p.userData.vel.set(0,0,0);
  }));
}

// ─── AI ────────────────────────────────────────────────────────────────────
function updatePlayers(dt) {
  teams.forEach((team, ti) => {
    const goalX = ti === 0 ? 35 : -35; // attack direction
    team.forEach((p, idx) => {
      const ud = p.userData;
      if (ud.kickCooldown > 0) ud.kickCooldown -= dt;

      const toBall = bPos.clone().sub(p.position);
      toBall.y = 0;
      const distBall = toBall.length();

      // Find closest player to ball on this team
      let minDist = Infinity, closest = null;
      team.forEach(pp => { const d = bPos.distanceTo(pp.position); if (d < minDist) { minDist = d; closest = pp; } });

      const isClosest = closest === p;
      let target = new THREE.Vector3();

      if (isClosest && idx !== 0) { // GK stays unless ball close
        target.copy(bPos); target.y = 0;
      } else if (idx === 0) { // goalkeeper
        target.set(goalX > 0 ? -33 : 33, 0, clamp(bPos.z, -4.5, 4.5));
      } else {
        // Blend between home position and support position near ball
        const support = bPos.clone();
        support.x += (goalX > 0 ? 3 : -3) + (Math.random()-0.5)*4;
        support.z += (Math.random()-0.5)*5;
        support.y = 0;
        const weight = Math.max(0, 1 - distBall / 30);
        target.lerpVectors(ud.home, support, weight * 0.6);
      }

      const dir = target.sub(p.position); dir.y = 0;
      const dist = dir.length();
      if (dist > 0.5) {
        dir.normalize();
        const spd = isClosest ? 0.15 : 0.08;
        ud.vel.lerp(dir.multiplyScalar(spd), 0.1);
      } else {
        ud.vel.multiplyScalar(0.8);
      }

      p.position.add(ud.vel);
      p.position.x = clamp(p.position.x, -34, 34);
      p.position.z = clamp(p.position.z, -24, 24);
      p.position.y = 0;

      // Rotate toward movement
      if (ud.vel.length() > 0.01) {
        p.rotation.y = Math.atan2(ud.vel.x, ud.vel.z);
      }

      // Kick ball if close enough
      if (distBall < 1.3 && ud.kickCooldown <= 0) {
        const kickDir = new THREE.Vector3(goalX, 0.15 + Math.random()*0.1, (Math.random()-0.5)*0.8).normalize();
        bVel.copy(kickDir.multiplyScalar(0.4 + Math.random()*0.2));
        ud.kickCooldown = 40 + Math.random()*40;
      }
    });
  });
}

// ─── HUD ───────────────────────────────────────────────────────────────────
const s1el = document.getElementById('s1');
const s2el = document.getElementById('s2');
const timerEl = document.getElementById('timer');
const banner = document.getElementById('goal-banner');

function showGoal() {
  banner.style.display = 'block';
  goalTimer = 2.5;
}

// ─── Animate ───────────────────────────────────────────────────────────────
let prev = performance.now();
function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min((now - prev) / 16.667, 3);
  prev = now;

  if (!paused) {
    elapsed += dt * 16.667 / 1000;

    // Ball physics
    bVel.y += GRAVITY;
    bPos.add(bVel);

    if (bPos.y <= 0.5) { bPos.y = 0.5; bVel.y = Math.abs(bVel.y) * BOUNCE; if (Math.abs(bVel.y) < 0.03) bVel.y = 0; }
    if (bPos.y > 30) { bPos.y = 30; bVel.y *= -BOUNCE; }

    // Wall bounce (non-goal sides)
    if (bPos.z > HALF_H) { bPos.z = HALF_H; bVel.z *= -BOUNCE; }
    if (bPos.z < -HALF_H) { bPos.z = -HALF_H; bVel.z *= -BOUNCE; }
    if (bPos.x > HALF_W && (Math.abs(bPos.z) > GOAL_Z_HALF || bPos.y > GOAL_Y_TOP)) { bPos.x = HALF_W; bVel.x *= -BOUNCE; }
    if (bPos.x < -HALF_W && (Math.abs(bPos.z) > GOAL_Z_HALF || bPos.y > GOAL_Y_TOP)) { bPos.x = -HALF_W; bVel.x *= -BOUNCE; }

    bVel.x *= FRICTION; bVel.z *= FRICTION;

    // Goal check
    const g = checkGoal();
    if (g >= 0) {
      score[g]++;
      s1el.textContent = score[0];
      s2el.textContent = score[1];
      showGoal();
      resetPositions();
    }

    ball.position.copy(bPos);
    ball.rotation.x += bVel.z * 2; ball.rotation.z -= bVel.x * 2;
    shadowBlob.position.set(bPos.x, 0.01, bPos.z);
    shadowBlob.material.opacity = Math.max(0.05, 0.35 - bPos.y * 0.03);

    updatePlayers(dt);

    // Goal banner
    if (goalTimer > 0) { goalTimer -= dt * 16.667 / 1000; if (goalTimer <= 0) banner.style.display = 'none'; }

    // Timer
    const m = Math.floor(elapsed / 60).toString().padStart(2,'0');
    const s = Math.floor(elapsed % 60).toString().padStart(2,'0');
    timerEl.textContent = `⏱ ${m}:${s}`;
  }

  // Camera keys
  if (keys['ArrowLeft']  || keys['KeyA']) camTheta += 0.02;
  if (keys['ArrowRight'] || keys['KeyD']) camTheta -= 0.02;
  if (keys['ArrowUp']    || keys['KeyW']) camPhi = Math.max(0.15, camPhi - 0.02);
  if (keys['ArrowDown']  || keys['KeyS']) camPhi = Math.min(1.2,  camPhi + 0.02);

  camera.position.set(
    camDist * Math.sin(camTheta) * Math.cos(camPhi),
    camDist * Math.sin(camPhi),
    camDist * Math.cos(camTheta) * Math.cos(camPhi)
  );
  camera.lookAt(0, 2, 0);

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

animate();
</script>
</body>
</html>
